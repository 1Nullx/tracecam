<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101521">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TraceCam">
  <title>TraceCam — Art Tracer</title>
  <style>
    :root { color-scheme: dark; --bg: #101521; --panel: #192131; --line: #344055; --accent: #8ec5ff; --text: #f5f7fa; --muted: #a9b5c9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    body { overscroll-behavior: none; }
    button, input { font: inherit; }
    button, .choose { -webkit-tap-highlight-color: transparent; }
    .app { height: 100dvh; min-height: 450px; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--bg); flex: none; }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.5px; }
    .tag { color: var(--muted); font-size: 12px; }
    .viewport { flex: 1 1 auto; position: relative; overflow: hidden; background: #0b0f19; min-height: 145px; isolation: isolate; }
    .viewport:before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at center, #243246 0, #0b0f19 78%); }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: transparent; }
    .hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 250px; width: 85%; color: #d8e1ed; font-size: 14px; line-height: 1.45; text-align: center; pointer-events: none; text-shadow: 0 1px 6px black; }
    .hint span { display: block; font-size: 34px; margin-bottom: 6px; }
    .photo { position: absolute; top: 50%; left: 50%; width: min(72vw, 420px); transform: translate(calc(-50% + var(--x, 0px)), calc(-50% + var(--y, 0px))) rotate(var(--rotate, 0deg)) scale(var(--zoom, 1)); transform-origin: center center; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
    .photo:active { cursor: grabbing; }
    .photo img { display: block; width: 100%; max-height: 70vh; object-fit: contain; opacity: var(--opacity, .5); pointer-events: none; -webkit-user-drag: none; }
    .photo.locked { pointer-events: none; }
    .photo:not(.locked):after { content: ""; position: absolute; inset: -3px; border: 1px dashed rgba(255,255,255,.6); border-radius: 4px; pointer-events: none; }
    .status { position: absolute; top: 10px; left: 10px; right: 10px; width: fit-content; max-width: calc(100% - 20px); padding: 7px 10px; border-radius: 999px; font-size: 12px; color: white; background: rgba(9,16,27,.72); backdrop-filter: blur(8px); pointer-events: none; }
    .controls { flex: 0 0 auto; max-height: 51dvh; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .action { display: flex; justify-content: center; align-items: center; min-height: 44px; border-radius: 12px; background: #2d3b50; color: #fff; border: 1px solid #4a5b73; font-weight: 650; font-size: 14px; text-align: center; padding: 7px 8px; cursor: pointer; }
    .action.primary, .choose { background: var(--accent); color: #081222; border-color: var(--accent); }
    .action.active { background: #2d574d; border-color: #4aaf93; }
    input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    .sliders { display: grid; gap: 10px; margin-top: 13px; }
    .slider-row { display: grid; grid-template-columns: 88px 1fr 42px; gap: 10px; align-items: center; }
    .slider-row label { font-size: 13px; font-weight: 600; }
    output { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
    input[type="range"] { display: block; width: 100%; accent-color: var(--accent); height: 30px; min-width: 0; }
    .extras { display: flex; gap: 8px; margin-top: 12px; }
    .extras .action { flex: 1; background: #253144; border-color: #40516a; }
    .help { font-size: 11px; line-height: 1.45; color: var(--muted); margin: 10px 0 0; text-align: center; }
    [hidden] { display: none !important; }
    @media (min-width: 700px) { .app { max-width: 520px; margin: auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>✏️ TraceCam</h1>
      <span class="tag">Your pocket art tracer</span>
    </header>
    <main class="viewport" id="viewport" aria-label="Live camera preview with a movable reference image">
      <video id="camera" autoplay playsinline muted aria-label="Camera"></video>
      <div class="hint" id="hint"><span>📷</span>Tap <b>Start camera</b>, then <b>Choose photo</b> to put your reference over the view.</div>
      <div class="photo" id="photo" hidden><img id="art" alt="Reference photo to trace" draggable="false"></div>
      <div class="status" id="status" role="status" aria-live="polite">Camera is off</div>
    </main>
    <section class="controls" aria-label="Tracing controls">
      <div class="actions">
        <button id="cameraBtn" class="action primary" type="button">Start camera</button>
        <label class="action choose" for="file">Choose photo</label>
        <input id="file" type="file" accept="image/*" aria-label="Choose an image from your photo library">
      </div>
      <div class="sliders">
        <div class="slider-row"><label for="opacity">Opacity</label><input id="opacity" type="range" min="5" max="100" value="50"><output id="opacityOut" for="opacity">50%</output></div>
        <div class="slider-row"><label for="zoom">Size</label><input id="zoom" type="range" min="20" max="350" value="100"><output id="zoomOut" for="zoom">100%</output></div>
        <div class="slider-row"><label for="rotation">Rotation</label><input id="rotation" type="range" min="-180" max="180" value="0"><output id="rotationOut" for="rotation">0°</output></div>
      </div>
      <div class="extras">
        <button id="lockBtn" class="action" type="button" aria-pressed="false">🔓 Lock image</button>
        <button id="resetBtn" class="action" type="button">↺ Reset</button>
        <button id="flipBtn" class="action" type="button">⇄ Flip camera</button>
      </div>
      <p class="help">Drag the picture with one finger. Lock it before tracing. For the clearest result, hold your phone still above your paper.</p>
    </section>
  </div>
  <script>
    "use strict";
    const $ = id => document.getElementById(id);
    const video = $("camera"), cameraBtn = $("cameraBtn"), photo = $("photo"), art = $("art");
    const status = $("status"), hint = $("hint"), file = $("file");
    const opacity = $("opacity"), zoom = $("zoom"), rotation = $("rotation");
    let stream = null, facing = "environment", objectURL = null;
    let x = 0, y = 0, locked = false, dragging = false;
    let pointerStartX = 0, pointerStartY = 0, startX = 0, startY = 0;

    function setStatus(message) { status.textContent = message; }
    function apply() {
      photo.style.setProperty("--x", x + "px");
      photo.style.setProperty("--y", y + "px");
      photo.style.setProperty("--opacity", String(Number(opacity.value) / 100));
      photo.style.setProperty("--zoom", String(Number(zoom.value) / 100));
      photo.style.setProperty("--rotate", rotation.value + "deg");
      $("opacityOut").textContent = opacity.value + "%";
      $("zoomOut").textContent = zoom.value + "%";
      $("rotationOut").textContent = rotation.value + "°";
    }
    [opacity, zoom, rotation].forEach(input => input.addEventListener("input", apply));
    apply();

    function stopCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      cameraBtn.textContent = "Start camera";
    }
    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("Camera requires Safari on a secure HTTPS website.");
        return;
      }
      cameraBtn.disabled = true;
      setStatus("Asking for camera permission…");
      try {
        // Try the preferred rear camera; fall back if that choice is unavailable.
        let newStream;
        try {
          newStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: facing } } });
        } catch (firstError) {
          if (firstError.name === "NotAllowedError" || firstError.name === "SecurityError") throw firstError;
          newStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
        }
        stopCamera();
        stream = newStream;
        video.srcObject = stream;
        await video.play();
        cameraBtn.textContent = "Stop camera";
        setStatus("Camera on · Image stays fixed on your screen");
        hint.hidden = true;
      } catch (error) {
        stopCamera();
        setStatus(error.name === "NotAllowedError" ? "Camera blocked. Allow camera access in Safari settings." : "Could not start the camera: " + (error.message || error.name));
      } finally {
        cameraBtn.disabled = false;
      }
    }
    cameraBtn.addEventListener("click", () => {
      if (stream) { stopCamera(); setStatus("Camera is off"); }
      else startCamera();
    });
    $("flipBtn").addEventListener("click", () => {
      facing = facing === "environment" ? "user" : "environment";
      startCamera();
    });
    file.addEventListener("change", () => {
      const chosen = file.files?.[0];
      if (!chosen) return;
      if (!chosen.type.startsWith("image/")) { setStatus("Please choose an image file."); return; }
      const previous = objectURL;
      objectURL = URL.createObjectURL(chosen);
      art.onload = () => {
        if (previous) URL.revokeObjectURL(previous);
        photo.hidden = false;
        x = 0; y = 0; zoom.value = "100"; rotation.value = "0";
        apply();
        setStatus("Photo ready · Drag it into place");
        hint.hidden = true;
      };
      art.onerror = () => {
        URL.revokeObjectURL(objectURL);
        objectURL = previous;
        setStatus("This image could not be opened. Try JPG or PNG.");
      };
      art.src = objectURL;
    });
    $("lockBtn").addEventListener("click", () => {
      locked = !locked;
      photo.classList.toggle("locked", locked);
      $("lockBtn").textContent = locked ? "🔒 Unlock image" : "🔓 Lock image";
      $("lockBtn").setAttribute("aria-pressed", String(locked));
      $("lockBtn").classList.toggle("active", locked);
      setStatus(locked ? "Image locked in place" : "Image unlocked · Drag to reposition");
    });
    $("resetBtn").addEventListener("click", () => {
      x = 0; y = 0; zoom.value = "100"; rotation.value = "0"; opacity.value = "50";
      apply();
      setStatus("Position and sliders reset");
    });
    photo.addEventListener("pointerdown", event => {
      if (locked || event.button !== 0 || dragging) return;
      dragging = true;
      pointerStartX = event.clientX; pointerStartY = event.clientY;
      startX = x; startY = y;
      photo.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    photo.addEventListener("pointermove", event => {
      if (!dragging || !photo.hasPointerCapture(event.pointerId)) return;
      x = startX + event.clientX - pointerStartX;
      y = startY + event.clientY - pointerStartY;
      apply();
    });
    function endDrag(event) {
      if (photo.hasPointerCapture(event.pointerId)) photo.releasePointerCapture(event.pointerId);
      dragging = false;
    }
    photo.addEventListener("pointerup", endDrag);
    photo.addEventListener("pointercancel", endDrag);
    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
