
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe1f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TraceCam">
<title>TraceCam ♡ Pink Edition</title>

<style>
:root {
  color-scheme: light;
  --pink: #ffb8df;
  --purple: #b78de9;
  --ink: #754b91;
  --muted: #9c7cae;
  --border: #e9c8f1;
}

* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f6e8ff;
  color: var(--ink);
  overscroll-behavior: none;
}

button, input { font: inherit; }

.app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 520px;
  margin: auto;
  overflow: hidden;
  background: #fff7fd;
}

header {
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex: none;
  background: linear-gradient(120deg, #ffe2f3, #eee1ff);
  border-bottom: 1px solid var(--border);
}

h1 {
  margin: 0;
  font-size: 22px;
  color: #9655be;
}

.tag {
  font-size: 12px;
  color: #a071af;
  text-align: right;
}

.viewport {
  flex: 1 1 auto;
  min-height: 150px;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: #25172f;
}

.viewport::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, #593d69, #25172f 80%);
}

video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

video.mirror { transform: scaleX(-1); }

.hint {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 86%;
  max-width: 270px;
  text-align: center;
  color: #fff1fb;
  line-height: 1.5;
  font-size: 14px;
  text-shadow: 0 2px 7px #1a0d22;
  pointer-events: none;
}

.hint span {
  display: block;
  font-size: 38px;
  margin-bottom: 6px;
}

.photo {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(72vw, 390px);
  transform:
    translate(
      calc(-50% + var(--x, 0px)),
      calc(-50% + var(--y, 0px))
    )
    rotate(var(--rotate, 0deg))
    scale(var(--zoom, 1));
  transform-origin: center;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}

.photo img {
  display: block;
  width: 100%;
  max-height: 65dvh;
  object-fit: contain;
  opacity: var(--opacity, .5);
  pointer-events: none;
  -webkit-user-drag: none;
}

.photo.locked { pointer-events: none; }

.photo:not(.locked)::after {
  content: "";
  position: absolute;
  inset: -3px;
  border: 1px dashed #ffd0f3;
  border-radius: 8px;
  pointer-events: none;
}

.status {
  position: absolute;
  top: 10px;
  left: 10px;
  max-width: calc(100% - 20px);
  padding: 7px 11px;
  border-radius: 20px;
  color: white;
  background: rgba(61,35,77,.78);
  backdrop-filter: blur(8px);
  font-size: 12px;
  pointer-events: none;
}

.controls {
  flex: none;
  max-height: 52dvh;
  overflow-y: auto;
  background: linear-gradient(180deg, #fff7fd, #f5eaff);
  border-top: 2px solid var(--border);
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.action {
  min-height: 44px;
  padding: 9px 8px;
  border: 1px solid #d8b8f0;
  border-radius: 16px;
  background: #eadbff;
  color: var(--ink);
  font-size: 14px;
  font-weight: 650;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.action.primary {
  background: linear-gradient(125deg, #c39aef, #a77ce3);
  border-color: #a77ce3;
  color: white;
}

.action.choose {
  background: linear-gradient(125deg, #ffd2eb, #f4a9d9);
  border-color: #f5a3d6;
  color: #724583;
}

.action.active {
  background: #f6d9f5;
  border-color: #d59adb;
}

.action:disabled { opacity: .65; }

input[type="file"] {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  overflow: hidden;
}

.sliders {
  display: grid;
  gap: 9px;
  margin-top: 13px;
}

.slider-row {
  display: grid;
  grid-template-columns: 72px 1fr 43px;
  gap: 10px;
  align-items: center;
}

.slider-row label {
  font-size: 13px;
  font-weight: 650;
}

input[type="range"] {
  display: block;
  width: 100%;
  height: 30px;
  min-width: 0;
  accent-color: #ab7ce5;
}

output {
  text-align: right;
  color: var(--muted);
  font-size: 12px;
}

.extras {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}

.extras .action {
  font-size: 13px;
  padding: 8px 5px;
}

.help {
  margin: 10px 0 0;
  font-size: 11px;
  text-align: center;
  color: var(--muted);
  line-height: 1.5;
}

/* 🎀 FULL SCREEN MODE 🎀 */

.app.full-view {
  width: 100%;
  max-width: none;
}

.app.full-view header,
.app.full-view .controls {
  display: none;
}

.app.full-view .viewport {
  flex: 1 1 auto;
  min-height: 0;
}

.app.full-view .status {
  top: calc(12px + env(safe-area-inset-top));
  max-width: calc(100% - 130px);
}

.exit-full {
  position: absolute;
  z-index: 10;
  top: calc(12px + env(safe-area-inset-top));
  right: 12px;
  min-height: 44px;
  padding: 10px 13px;
  border: 1px solid #d8b8f0;
  border-radius: 16px;
  background: #ffe5f8;
  color: var(--ink);
  font-weight: 700;
  cursor: pointer;
}

[hidden] { display: none !important; }
</style>
</head>

<body>
<div class="app" id="app">

<header>
  <h1>🎀 TraceCam</h1>
  <span class="tag">your dreamy art tracer ♡</span>
</header>

<main class="viewport" aria-label="Camera preview with tracing image">

  <video id="camera" autoplay playsinline muted></video>

  <div class="hint" id="hint">
    <span>📷</span>
    Tap <b>Start camera</b>, then <b>Choose photo</b>
    to trace over your paper. ♡
  </div>

  <div class="photo" id="photo" hidden>
    <img id="art" alt="Your tracing reference" draggable="false">
  </div>

  <div class="status" id="status" role="status">
    Camera is off ♡
  </div>

  <button class="exit-full" id="exitFullBtn" type="button" hidden>
    ✕ Exit
  </button>

</main>

<section class="controls" aria-label="Tracing controls">

  <div class="actions">
    <button class="action primary" id="cameraBtn" type="button">
      Start camera
    </button>

    <label class="action choose" for="file">
      Choose photo ♡
    </label>

    <input id="file" type="file" accept="image/*">
  </div>

  <div class="sliders">

    <div class="slider-row">
      <label for="opacity">Opacity</label>
      <input id="opacity" type="range" min="5" max="100" value="50">
      <output id="opacityOut">50%</output>
    </div>

    <div class="slider-row">
      <label for="zoom">Size</label>
      <input id="zoom" type="range" min="20" max="350" value="100">
      <output id="zoomOut">100%</output>
    </div>

    <div class="slider-row">
      <label for="rotation">Rotation</label>
      <input id="rotation" type="range" min="-180" max="180" value="0">
      <output id="rotationOut">0°</output>
    </div>

  </div>

  <div class="extras">
    <button class="action" id="lockBtn" type="button">
      🔓 Lock image
    </button>

    <button class="action" id="resetBtn" type="button">
      ↺ Reset
    </button>

    <button class="action" id="flipBtn" type="button">
      ⇄ Flip camera
    </button>

    <button class="action" id="fullBtn" type="button">
      ⛶ Full screen
    </button>
  </div>

  <p class="help">
    Drag your picture with one finger, then lock it in place.
    Hold your iPhone steady while tracing. ✨
  </p>

</section>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

const video = $("camera");
const cameraBtn = $("cameraBtn");
const photo = $("photo");
const art = $("art");
const file = $("file");
const hint = $("hint");
const opacity = $("opacity");
const zoom = $("zoom");
const rotation = $("rotation");
const app = $("app");
const exitFullBtn = $("exitFullBtn");

let stream = null;
let facing = "environment";
let objectURL = null;

let x = 0;
let y = 0;
let locked = false;
let activePointer = null;
let pointerX = 0;
let pointerY = 0;
let startX = 0;
let startY = 0;

function setStatus(message) {
  $("status").textContent = message;
}

function apply() {
  photo.style.setProperty("--x", x + "px");
  photo.style.setProperty("--y", y + "px");
  photo.style.setProperty("--opacity", Number(opacity.value) / 100);
  photo.style.setProperty("--zoom", Number(zoom.value) / 100);
  photo.style.setProperty("--rotate", rotation.value + "deg");

  $("opacityOut").textContent = opacity.value + "%";
  $("zoomOut").textContent = zoom.value + "%";
  $("rotationOut").textContent = rotation.value + "°";
}

[opacity, zoom, rotation].forEach(slider => {
  slider.addEventListener("input", apply);
});

apply();

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;
  video.srcObject = null;
  cameraBtn.textContent = "Start camera";
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("Open the HTTPS website in Safari to use the camera.");
    return;
  }

  cameraBtn.disabled = true;
  setStatus("Opening camera…");
  stopCamera();

  try {
    let newStream;

    try {
      newStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facing }
        }
      });
    } catch (error) {
      if (
        error.name === "NotAllowedError" ||
        error.name === "SecurityError"
      ) {
        throw error;
      }

      newStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: true
      });
    }

    stream = newStream;
    video.srcObject = stream;
    video.classList.toggle("mirror", facing === "user");

    await video.play();

    cameraBtn.textContent = "Stop camera";
    hint.hidden = true;
    setStatus("Camera on ♡ Picture stays fixed on screen");

  } catch (error) {
    stopCamera();

    if (error.name === "NotAllowedError") {
      setStatus("Camera blocked. Allow camera access in Safari.");
    } else {
      setStatus("Camera unavailable: " + (error.message || error.name));
    }

  } finally {
    cameraBtn.disabled = false;
  }
}

cameraBtn.addEventListener("click", () => {
  if (stream) {
    stopCamera();
    setStatus("Camera is off ♡");
  } else {
    startCamera();
  }
});

$("flipBtn").addEventListener("click", () => {
  facing = facing === "environment" ? "user" : "environment";

  if (stream) {
    startCamera();
  } else {
    setStatus("Camera set to " + (facing === "user" ? "front" : "back") + " ♡");
  }
});

file.addEventListener("change", () => {
  const chosen = file.files?.[0];

  if (!chosen) return;

  if (!chosen.type.startsWith("image/")) {
    setStatus("Please choose a photo.");
    return;
  }

  const nextURL = URL.createObjectURL(chosen);

  art.onload = () => {
    if (objectURL) URL.revokeObjectURL(objectURL);

    objectURL = nextURL;
    photo.hidden = false;

    x = 0;
    y = 0;
    zoom.value = "100";
    rotation.value = "0";

    apply();

    hint.hidden = true;
    setStatus("Picture ready! Drag it into place ♡");
  };

  art.onerror = () => {
    URL.revokeObjectURL(nextURL);
    setStatus("Couldn't open that image. Try JPG or PNG.");
  };

  art.src = nextURL;
  file.value = "";
});

$("lockBtn").addEventListener("click", () => {
  locked = !locked;

  photo.classList.toggle("locked", locked);
  $("lockBtn").classList.toggle("active", locked);
  $("lockBtn").setAttribute("aria-pressed", String(locked));

  $("lockBtn").textContent = locked
    ? "🔒 Unlock image"
    : "🔓 Lock image";

  setStatus(locked ? "Picture locked in place ♡" : "Picture unlocked ♡");
});

$("resetBtn").addEventListener("click", () => {
  x = 0;
  y = 0;

  opacity.value = "50";
  zoom.value = "100";
  rotation.value = "0";

  apply();
  setStatus("Picture position reset ♡");
});

photo.addEventListener("pointerdown", (event) => {
  if (locked || activePointer !== null || event.button !== 0) return;

  activePointer = event.pointerId;
  pointerX = event.clientX;
  pointerY = event.clientY;
  startX = x;
  startY = y;

  photo.setPointerCapture(event.pointerId);
  event.preventDefault();
});

photo.addEventListener("pointermove", (event) => {
  if (event.pointerId !== activePointer) return;

  x = startX + event.clientX - pointerX;
  y = startY + event.clientY - pointerY;

  apply();
});

function endDrag(event) {
  if (event.pointerId !== activePointer) return;

  if (photo.hasPointerCapture(event.pointerId)) {
    photo.releasePointerCapture(event.pointerId);
  }

  activePointer = null;
}

photo.addEventListener("pointerup", endDrag);
photo.addEventListener("pointercancel", endDrag);

/* 🎀 FULL SCREEN FUNCTION 🎀 */

function setFullView(enabled) {
  app.classList.toggle("full-view", enabled);
  exitFullBtn.hidden = !enabled;
  $("fullBtn").setAttribute("aria-pressed", String(enabled));
}

$("fullBtn").addEventListener("click", () => {
  setFullView(true);
});

exitFullBtn.addEventListener("click", () => {
  setFullView(false);
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") setFullView(false);
});

window.addEventListener("pagehide", stopCamera);
</script>

</body>
</html>
